name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:rates
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (preview mode, unsigned rates allowed)
        run: npm run build
        env:
          NEXT_PUBLIC_ALLOW_UNVERIFIED: "1"
          NEXT_PUBLIC_SITE_URL: https://paycheckdecoder.com
